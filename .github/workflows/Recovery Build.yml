<content>
name: Recovery Build

on:
  workflow_dispatch:
    inputs:
      SYNC_URL:
        description: 'SYNC_URL'
        required: true
        default: 'https://gitlab.com/OrangeFox/sync.git'
      MANIFEST_BRANCH:
        description: 'MANIFEST_BRANCH'
        required: true
        default: '11.0'
      DEVICE_TREE_URL:
        description: 'DEVICE_TREE_URL'
        required: true
        default: 'https://github.com/OrangeFoxRecovery/device_xiaomi_garden'
      DEVICE_TREE_BRANCH:
        description: 'DEVICE_TREE_BRANCH'
        required: true
        default: 'fox_11.0_Q'
      DEVICE_PATH:
        description: 'DEVICE_PATH'
        required: true
        default: 'device/xiaomi/garden'
      COMMON_TREE_URL:
        description: 'COMMON_TREE_URL (if no common tree, leave blank)'
        required: false
      COMMON_PATH:
        description: 'COMMON_PATH (if no common tree, leave blank)'
        required: false
      DEVICE_NAME:
        description: 'DEVICE_NAME'
        required: true
        default: 'garden'
      MAKEFILE_NAME:
        description: 'MAKEFILE_NAME'
        required: true
        default: 'twrp_garden'
      BUILD_TARGET:
        description: 'BUILD_TARGET'
        required: true
        default: 'recovery'

jobs:
  build:
    if: github.event.repository.owner.id == github.event.sender.id
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:

    - name: Check Out
      uses: actions/checkout@v4

    - name: Cleanup
      uses: rokibhasansagar/slimhub_actions@main

    - name: Initialize workspace
      run: |
        mkdir workspace
        cd workspace
        echo "workspace-folder=$(pwd)" >> $GITHUB_OUTPUT
      id: pwd

    - name: Install OpenJDK (Temurin 17)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Verify Java
      run: |
        echo "JAVA_HOME=$JAVA_HOME"
        if [ -n "$JAVA_HOME" ]; then
          ls -ld "$JAVA_HOME" || true
        fi
        java -version || true

    - name: Prepare the build environment
      run: |
        sudo apt update && sudo apt upgrade -y
        DEBIAN_FRONTEND=noninteractive sudo apt install -yq \
            linux-modules-extra-$(uname -r) \
            git python3 tar aria2
        git clone "https://gitlab.com/OrangeFox/misc/scripts"
        cd scripts
        sudo env JAVA_HOME="$JAVA_HOME" PATH="$PATH" bash setup/android_build_env.sh
        sed -i 's/cd -/cd ../g' setup/install_android_sdk.sh
        sudo env JAVA_HOME="$JAVA_HOME" PATH="$PATH" bash setup/install_android_sdk.sh
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Setup SSH Keys
      if: ${{ startsWith(github.event.inputs.SYNC_URL, 'git@github.com') || 
          startsWith(github.event.inputs.DEVICE_TREE_URL, 'git@github.com') ||
          startsWith(github.event.inputs.COMMON_TREE_URL, 'git@github.com') }}
      uses: webfactory/ssh-agent@v0.9.0
      with:
        ssh-private-key: |
          ${{ secrets.SSH_PRIVATE_KEY }}

    - name: Sync OrangeFox sources and minimal manifest
      run: |
        cd "${{ steps.pwd.outputs.workspace-folder }}"
        git clone "${{ github.event.inputs.SYNC_URL }}"
        cd sync
        ./orangefox_sync.sh --branch "${{ github.event.inputs.MANIFEST_BRANCH }}" --path "${{ steps.pwd.outputs.workspace-folder }}/fox_${{ github.event.inputs.MANIFEST_BRANCH }}"
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Clone device tree
      run: |
        cd "${{ steps.pwd.outputs.workspace-folder }}/fox_${{ github.event.inputs.MANIFEST_BRANCH }}"
        git clone "${{ github.event.inputs.DEVICE_TREE_URL }}" -b "${{ github.event.inputs.DEVICE_TREE_BRANCH }}" "./${{ github.event.inputs.DEVICE_PATH }}"
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Clone common tree
      if: ${{ github.event.inputs.COMMON_TREE_URL != '' && github.event.inputs.COMMON_PATH != '' }}
      run: |
        cd "${{ steps.pwd.outputs.workspace-folder }}/fox_${{ github.event.inputs.MANIFEST_BRANCH }}"
        git clone "${{ github.event.inputs.COMMON_TREE_URL }}" -b "${{ github.event.inputs.DEVICE_TREE_BRANCH }}" "./${{ github.event.inputs.COMMON_PATH }}"
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Set Swap Space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 12

    - name: Debug manifest & release config
      run: |
        echo "=== release_config.mk (head) ==="
        sed -n '1,300p' build/make/core/release_config.mk || true
        echo
        echo "=== .repo/manifest.xml (head) ==="
        sed -n '1,200p' .repo/manifest.xml || true
        echo
        echo "=== .repo/local_manifests dir ==="
        ls -al .repo/local_manifests || true
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ github.event.inputs.MANIFEST_BRANCH }}

    - name: Building recovery
      run: |
        cd "${{ steps.pwd.outputs.workspace-folder }}/fox_${{ github.event.inputs.MANIFEST_BRANCH }}"
        set +e
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        set -e

        combos=$(grep -R --line-buffered "add_lunch_combo" "./${{ github.event.inputs.DEVICE_PATH }}" 2>/dev/null \
                 | sed -E 's/.*add_lunch_combo[[:space:]]*//g' \
                 | sed -E "s/['\"]//g" \
                 | awk '{print $1}' \
                 | sort -u || true)

        if [ -z "$combos" ]; then
          combos=$(grep -R --line-buffered "add_lunch_combo" . 2>/dev/null \
                   | sed -E 's/.*add_lunch_combo[[:space:]]*//g' \
                   | sed -E "s/['\"]//g" \
                   | awk '{print $1}' \
                   | sort -u || true)
        fi

        echo "Available lunch combos (sample):"
        printf '%s\n' "$combos" | sed -n '1,50p'

        DESIRED="${{ github.event.inputs.MAKEFILE_NAME }}"
        LUNCH_CMD=""

        if printf '%s\n' "$DESIRED" | grep -q -- '-'; then
          if printf '%s\n' "$combos" | grep -qx "$DESIRED"; then
            LUNCH_CMD="$DESIRED"
          fi
        else
          for suf in eng userdebug user; do
            if printf '%s\n' "$combos" | grep -qx "${DESIRED}-${suf}"; then
              LUNCH_CMD="${DESIRED}-${suf}"
              break
            fi
          done
          if [ -z "$LUNCH_CMD" ]; then
            LUNCH_CMD=$(printf '%s\n' "$combos" | grep -i "$DESIRED" | head -n1 || true)
          fi
        fi

        if [ -z "$LUNCH_CMD" ]; then
          echo "ERROR: no matching lunch combo found for '${DESIRED}'."
          echo "Available combos (first 200 lines):"
          printf '%s\n' "$combos" | sed -n '1,200p'
          exit 1
        fi

        # Do not auto-normalize underscores into hyphens. Use the combo found as-is to avoid
        # generating a TARGET_RELEASE that doesn't exist in release_config.mk.

        echo "Using lunch combo: $LUNCH_CMD"
        lunch "$LUNCH_CMD" && make clean && mka adbd "${{ github.event.inputs.BUILD_TARGET }}"image -j$(nproc --all)
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Check the output directory before uploading
      run: |
        ls -al "${{ steps.pwd.outputs.workspace-folder }}/fox_${{ github.event.inputs.MANIFEST_BRANCH }}/out/target/product/"
        echo
        ls -al "${{ steps.pwd.outputs.workspace-folder }}/fox_${{ github.event.inputs.MANIFEST_BRANCH }}/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/"

    - name: Upload to Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ github.event.inputs.MANIFEST_BRANCH }}/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/*.img
          ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ github.event.inputs.MANIFEST_BRANCH }}/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/*.zip
        name: ${{ github.event.inputs.DEVICE_NAME }}-${{ github.run_id }}
        tag_name: ${{ github.run_id }}
        body: |
          Manifest: ${{ github.event.inputs.MANIFEST_BRANCH }}
          Device: ${{ github.event.inputs.DEVICE_NAME }}
          Target: ${{ github.event.inputs.BUILD_TARGET }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
</content>
